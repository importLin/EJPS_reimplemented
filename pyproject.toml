[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ejps"
version = "0.1.0"
description = "Ciphertext-only attack (EJPS sub-block restoration + block jigsaw) on block-wise EtC images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["ejps", "ejps.restore", "ejps.jigsaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.isort]
known-first-party = ["ejps"]
